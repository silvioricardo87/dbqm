name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --locked --all-extras

      - name: Lint
        run: uvx ruff check .

      - name: Test
        run: uv run pytest -q
