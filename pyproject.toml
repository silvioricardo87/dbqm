[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dbqm"
dynamic = ["version"]
description = "Multi-database interactive query tool with fullscreen TUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "textual>=0.80",
    "oracledb>=2.0",
    "pymssql>=2.2",
    "psycopg[binary]>=3.1",
    "PyMySQL>=1.1",
    "cryptography>=41.0",
    "sqlparse>=0.5",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
dbqm = "dbqm.main:main"

[tool.setuptools.dynamic]
version = {attr = "dbqm._version.__version__"}

[tool.setuptools.packages.find]
include = ["dbqm*"]
exclude = ["tests*", "dbqm.web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
