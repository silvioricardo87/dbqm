[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dbqm"
dynamic = ["version"]
description = "Multi-database interactive query tool with fullscreen TUI"
readme = {file = "PYPI.md", content-type = "text/markdown"}
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Silvio Chagas"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Database",
]

dependencies = [
    "rich>=13.0",
    "textual>=0.80",
    "PyMySQL>=1.1",
    "cryptography>=46.0.3",
    "sqlparse>=0.5",
    # No prebuilt wheels exist for oracledb / psycopg-binary / pymssql on
    # win-arm64. Skip them on that platform so `pip install dbqm` succeeds;
    # the recommended route on Windows ARM is to use Python AMD64 via x64
    # emulation, where every wheel is available. See README for details and
    # the `oracle`/`postgres`/`sqlserver` extras for opt-in installs.
    "oracledb>=2.0; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "psycopg[binary]>=3.1; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "pymssql>=2.2; sys_platform != 'win32' or platform_machine != 'ARM64'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]
oracle = ["oracledb>=2.0"]
postgres = ["psycopg[binary]>=3.1"]
sqlserver = ["pymssql>=2.2"]

[project.urls]
Homepage = "https://github.com/silvioricardo87/dbqm"
Repository = "https://github.com/silvioricardo87/dbqm"

[project.scripts]
dbqm = "dbqm.main:main"

[tool.setuptools.dynamic]
version = {attr = "dbqm._version.__version__"}

[tool.setuptools.packages.find]
include = ["dbqm*"]
exclude = ["tests*", "dbqm.web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"   # `requires-python = ">=3.10"`; users install into what they have

[tool.ruff.lint]
# The families the code passes today. Widen one at a time, fixing or
# justifying each finding -- never all at once, which is how a lint
# adoption gets reverted by lunchtime.
select = [
    "E9", "ICN", "TID", "W", "G", "INP",   # already clean when measured
    "FLY", "PIE", "C4", "ERA", "ISC", "E7",
    "PTH", "RET", "B",
]

# Measured on 2026-09-13, not guessed. Each is a deliberate deferral:
#   S    2300 -- almost all S101 (`assert` used), which is how a test
#                asserts. Right for production, wrong for a suite; needs a
#                per-path split, which is a later widening.
#   ANN  2448 -- missing annotations. That is the mypy step wearing a hat.
#   PL   1455 -- mostly complexity thresholds that would restructure working
#                code to satisfy a number nobody chose.
#   I     197 -- import order. First family to widen into; mostly automatic.
#   F     180 -- 129 unused variables, 45 unused imports. Second to widen.
